<!doctype html>
<html lang="fr" data-lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Une journée aux commandes — Guildwork</title>
<meta name="description" content="Passez une journée où des agents IA font le travail et où vous gardez le dernier mot. Deux minutes, rien à installer.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
 --ground:#0B1526;--surface:#0A1322;--strip:#14223A;--well:#070D18;
 --line:#1D2B44;--line-strong:#2B3B57;--line-amber:#6E5330;
 --card:linear-gradient(168deg,#1B2434 0%,#0F1929 55%,#0A1322 100%);
 --card-lead:linear-gradient(168deg,#232C3B 0%,#121C2D 52%,#0A1322 100%);
 --shadow-lift:0 2px 12px rgba(0,0,0,.5),0 26px 64px -34px rgba(0,0,0,.9);
 --ink:#F3EDE2;--ink-2:#9FAAC0;--ink-3:#6B7791;
 --amber:#E9A23B;--amber-2:#F5C46B;
 --run:#E8AE57;--next:#79B4E0;--you:#F3EDE2;--done:#78C48C;--stop:#E9A23B;
 color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
 font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.6}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
a{color:var(--amber-2);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:4px}
h1,h2,h3{text-wrap:balance}

header{border-bottom:1px solid var(--line);padding:16px 0}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.mark{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.glyph{width:24px;height:24px;border:1.5px solid var(--ink);border-radius:3px;position:relative;flex:none}
.glyph::after{content:"";position:absolute;left:4px;right:4px;top:9.6px;height:3px;background:var(--amber);border-radius:1px}
.wordmark{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:16px}
.bar-end{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.hero{padding:40px 0 6px}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.13em;
 text-transform:uppercase;color:var(--ink-3);margin:0 0 12px}
h1{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:clamp(2rem,4.6vw,2.9rem);
 line-height:1.06;margin:0 0 12px;letter-spacing:-.018em}
.lede{color:var(--ink-2);max-width:60ch;margin:0;font-size:17px}

.tk{background:transparent;border:1px solid var(--line-strong);color:var(--ink-2);
 font:inherit;font-size:13.5px;padding:7px 14px;border-radius:7px;cursor:pointer}
.tk:hover{color:var(--ink);border-color:#4E5F80}
.tk[aria-pressed=true]{background:var(--strip);border-color:var(--amber);color:var(--ink);font-weight:600}

.stage{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;padding:28px 0 0}
@media(min-width:940px){.stage{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:26px;align-items:start}}

.board{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.board-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
 padding:14px 18px;background:var(--strip);border-bottom:1px solid var(--line)}
.board-head h2{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:1.05rem;margin:0}
.clock{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-3)}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:1fr auto;gap:6px 14px;padding:14px 18px;
 border-bottom:1px solid var(--line);position:relative;transition:opacity .3s}
.row:last-child{border-bottom:0}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:transparent;transition:background .3s}
.row.s-run::before{background:var(--run)} .row.s-next::before{background:var(--next)}
.row.s-you::before{background:var(--you)} .row.s-done::before{background:var(--done)}
.row.s-stop::before{background:var(--stop)}
.row.s-done{opacity:.72}
.who{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;
 text-transform:uppercase;color:var(--ink-3);margin:0 0 3px}
.what{margin:0;font-size:14.8px;font-weight:500;line-height:1.35}
.badge{align-self:start;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;
 text-transform:uppercase;padding:3px 9px;border-radius:20px;border:1px solid;white-space:nowrap}
.s-run .badge{color:var(--run);border-color:rgba(232,174,87,.45);background:rgba(232,174,87,.12)}
.s-next .badge{color:var(--next);border-color:rgba(121,180,224,.4);background:rgba(121,180,224,.1)}
.s-you .badge{color:#0B1526;border-color:var(--you);background:var(--you);font-weight:600}
.s-done .badge{color:var(--done);border-color:rgba(120,196,140,.45);background:rgba(120,196,140,.12)}
.s-stop .badge{color:var(--stop);border-color:rgba(233,162,59,.5);background:rgba(233,162,59,.14)}
.track-bar{grid-column:1/-1;height:3px;background:var(--well);border-radius:2px;overflow:hidden;margin-top:4px}
.track-bar i{display:block;height:100%;width:0;background:var(--run);border-radius:2px;transition:width .28s linear}
.s-done .track-bar i{background:var(--done)}

.panel{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:20px}
.panel.lead{border-color:var(--line-amber);background:var(--card-lead);box-shadow:var(--shadow-lift)}
.panel h3{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:1.18rem;margin:0 0 8px}
.panel p{margin:0 0 12px;font-size:14.6px;color:var(--ink-2)}
.panel p.strongline{color:var(--ink)}
.kicker{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.13em;
 text-transform:uppercase;color:var(--amber);margin:0 0 10px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 19px;border-radius:8px;border:1px solid transparent;
 font:inherit;font-weight:600;font-size:14.5px;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--amber);color:#1B1206}
.btn.primary:hover{background:var(--amber-2)}
.btn.ghost{border-color:var(--line-strong);color:var(--ink);background:transparent;font-weight:400}
.btn.ghost:hover{border-color:#4E5F80;background:var(--strip)}
.btn.big{padding:14px 26px;font-size:16px}
details.tech{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
details.tech summary{cursor:pointer;font-family:"IBM Plex Mono",monospace;font-size:10.5px;
 letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
details.tech summary:hover{color:var(--ink-2)}
pre{margin:12px 0 0;background:var(--well);border:1px solid var(--line);border-radius:8px;padding:13px;
 overflow-x:auto;font-family:"IBM Plex Mono",monospace;font-size:12px;line-height:1.65;color:var(--ink-2);white-space:pre-wrap}
pre b{color:var(--ink);font-weight:500}

.tally{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:1px;background:var(--line);
 border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:18px 0 0}
.tally div{background:var(--surface);padding:14px 16px}
.tally b{display:block;font-family:"Fraunces",Georgia,serif;font-size:1.7rem;line-height:1.1;margin-bottom:2px}
.tally span{font-size:12.5px;color:var(--ink-3)}
.tally .hot b{color:var(--amber)}
.tally .good b{color:var(--done)}

.saved{border:1px solid var(--line-amber);background:rgba(233,162,59,.07);border-radius:8px;
 padding:12px 14px;margin:12px 0 0;font-size:14px;color:var(--ink-2)}
.saved b{color:var(--ink)}
.foot{border-top:1px solid var(--line);margin-top:40px;padding:20px 0 60px;color:var(--ink-3);font-size:13.4px}
.foot p{margin:0 0 7px;max-width:72ch}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:520px){.wrap{padding:0 16px}.hero{padding-top:30px}}
</style>
</head>
<body>

<header><div class="wrap bar">
 <a class="mark" href="../../"><span class="glyph" aria-hidden="true"></span><span class="wordmark">Guildwork</span></a>
 <span class="bar-end">
  <button class="tk" data-track="code" aria-pressed="true"></button>
  <button class="tk" data-track="nocode" aria-pressed="false"></button>
 </span>
</div></header>

<div class="wrap hero">
 <p class="eyebrow" id="eyebrow"></p>
 <h1 id="title"></h1>
 <p class="lede" id="lede"></p>
</div>

<div class="wrap stage">
 <section class="board">
  <div class="board-head"><h2 id="boardTitle"></h2><span class="clock" id="clock"></span></div>
  <div class="rows" id="rows"></div>
 </section>
 <aside id="side"></aside>
</div>

<div class="wrap foot">
 <p id="foot1"></p><p id="foot2"></p>
</div>

<script>
var LANG = document.documentElement.getAttribute("data-lang")==="fr" ? "fr" : "en";
var CAL = "https://cal.com/simon-pacifae-dupont/30min";

var T = {
 en:{
  code:"You have code", nocode:"You don't have code",
  eyebrow:"Interactive · nothing to install · 2 minutes",
  title:"A day in charge",
  lede:"Five pieces of work, agents that do them, and you. Press start and see what actually reaches you.",
  boardTitle:"Today", clockLabel:"start",
  startK:"Ready", startH:"Your day is waiting",
  startP:"Five jobs, two agents working at once. Nothing starts until you say so, and nothing leaves without a name on it.",
  startBtn:"Start the day",
  runK:"Running", runH:"They are working",
  runP:"Two at a time, never more. The rest wait their turn. You have nothing to do until something needs you.",
  stopK:"Stopped before it went out", fixBtn:"Fix it and run it again",
  gateK:"This one is yours", approve:"Approve and send", ret:"Send it back",
  retP:"Sent back with your reason. It will come back corrected.",
  endK:"End of day", endH:"Everything landed",
  tDone:"jobs finished", tClicks:"clicks from you", tWork:"of their work", tSaved:"caught before it went out",
  endBtn:"I want this day", endGhost:"Read the kit",
  endP:"That is the whole promise. The work runs without you. The decisions do not.",
  again:"Run it again",
  foot1:"Nothing here is a simulation of an AI. These are the states of a real board, the real refusals of the launcher, and the real shape of a working day.",
  foot2:"Times are compressed. Everything else is what the system does."
 },
 fr:{
  code:"Vous avez du code", nocode:"Vous n'avez pas de code",
  eyebrow:"Interactif · rien à installer · 2 minutes",
  title:"Une journée aux commandes",
  lede:"Cinq travaux, des agents qui les font, et vous. Lancez, et regardez ce qui remonte vraiment jusqu'à vous.",
  boardTitle:"Aujourd'hui", clockLabel:"départ",
  startK:"Prêt", startH:"Votre journée attend",
  startP:"Cinq travaux, deux agents à la fois. Rien ne démarre sans vous, et rien ne part sans un nom dessus.",
  startBtn:"Lancer la journée",
  runK:"En cours", runH:"Ils travaillent",
  runP:"Deux à la fois, jamais plus. Les autres attendent leur tour. Vous n'avez rien à faire tant que rien ne vous appelle.",
  stopK:"Arrêté avant de partir", fixBtn:"Corriger et relancer",
  gateK:"Celui-ci vous revient", approve:"Valider et envoyer", ret:"Renvoyer",
  retP:"Renvoyé avec votre motif. Il reviendra corrigé.",
  endK:"Fin de journée", endH:"Tout est livré",
  tDone:"travaux terminés", tClicks:"clics de votre part", tWork:"de leur travail", tSaved:"arrêté avant de sortir",
  endBtn:"Je veux cette journée", endGhost:"Lire le pack",
  endP:"C'est toute la promesse. Le travail tourne sans vous. Les décisions, non.",
  again:"Refaire une journée",
  foot1:"Rien ici ne simule une IA. Ce sont les états d'un vrai tableau, les vrais refus du lanceur, et la forme réelle d'une journée de travail.",
  foot2:"Les durées sont compressées. Tout le reste est ce que le système fait."
 }
};

var SCEN = {
 en:{
  code:[
   {who:"Claude Code",what:"Repair the sensor log read on start-up",h:1.5},
   {who:"Codex CLI",what:"Quote generator: use this year's price list",h:2,stop:{
     head:"A quote was about to go out on last year's prices",
     body:"The contract named the price file, and the file on the machine was the 2025 one. The launcher read the contract before starting and stopped there. Nothing ran, nothing was sent.",
     saved:"What it cost you: <b>nothing</b>. What it would have cost: a signed quote <b>4 200 € under</b>, found at invoicing.",
     tech:"$ tools/mission_launcher.py 118\ngovernance 4f1c9ab · read at runtime, never copied into the tool\n\n  ✓ contract fields read from the governance commit\n  ✗ <b>refused — condition 1: required field missing or ambiguous</b>\n\n    The declared scope names prices/2026.csv. That path does not exist at this\n    commit. A mission that cannot state its terms is not a contract.\n\n  nothing started · exit code 2"}},
   {who:"Grok Build",what:"Rewrite the failing test for the bridge",h:1},
   {who:"Claude Code",what:"Release notes for version 2.4",h:1.5,gate:{
     head:"Ready to go out, and it carries your name",
     body:"The notes are written, the checks are green, and a second seat that did not write them has read them. Publishing is yours: it is the one thing here that cannot be taken back.",
     detail:"Reviewed by: Grok HQ · 14 files · 0 failures introduced"}},
   {who:"Codex CLI",what:"Tidy the dependencies before the weekend",h:0.5}
  ],
  nocode:[
   {who:"The drafting assistant",what:"Reply to the Meyer file",h:1.5},
   {who:"The quote assistant",what:"Quote for the Lenoir site",h:2,stop:{
     head:"A quote was about to go out on last year's prices",
     body:"The request named the 2026 rate card. The file the assistant reached for was the 2025 one. It was stopped before writing a line, and you are being told now rather than at invoicing.",
     saved:"What it cost you: <b>nothing</b>. What it would have cost: a signed quote <b>4 200 € under</b>, found six weeks later.",
     tech:null}},
   {who:"The inbox assistant",what:"Sort and answer the simple tickets",h:1},
   {who:"The drafting assistant",what:"Answer to the complaint from Mrs Aubert",h:1.5,gate:{
     head:"Ready to go out, and it carries your name",
     body:"The answer is written, it names the documents it used, and a person who did not write it has read it. Sending is yours: it is the one thing here that cannot be taken back.",
     detail:"Read by: Camille · sources: the Aubert file, the 2026 terms"}},
   {who:"The minutes assistant",what:"Minutes of this morning's meeting",h:0.5}
  ]
 }
};
SCEN.fr = {
 code:[
  {who:"Claude Code",what:"Réparer la lecture du journal de capteur au démarrage",h:1.5},
  {who:"Codex CLI",what:"Générateur de devis : passer sur la grille de cette année",h:2,stop:{
    head:"Un devis partait sur la grille de l'an dernier",
    body:"Le contrat nommait le fichier de prix, et le fichier présent sur la machine était celui de 2025. Le lanceur a lu le contrat avant de démarrer et s'est arrêté là. Rien n'a tourné, rien n'est parti.",
    saved:"Ce que ça vous a coûté : <b>rien</b>. Ce que ça aurait coûté : un devis signé <b>4 200 € en dessous</b>, découvert à la facturation.",
    tech:"$ tools/mission_launcher.py 118\ngouvernance 4f1c9ab · lu au runtime, jamais copié dans l'outil\n\n  ✓ champs du contrat lus au commit de gouvernance\n  ✗ <b>refusé — condition 1 : champ requis absent ou ambigu</b>\n\n    Le périmètre déclaré nomme prices/2026.csv. Ce chemin n'existe pas à ce\n    commit. Une mission incapable d'énoncer ses termes n'est pas un contrat.\n\n  rien n'a démarré · code de sortie 2"}},
  {who:"Grok Build",what:"Réécrire le test en échec sur le pont",h:1},
  {who:"Claude Code",what:"Notes de version pour la 2.4",h:1.5,gate:{
    head:"Prêt à sortir, et ça porte votre nom",
    body:"Les notes sont écrites, les contrôles sont au vert, et un second siège qui ne les a pas écrites les a relues. La publication vous revient : c'est la seule chose ici qu'on ne peut pas reprendre.",
    detail:"Relu par : Grok HQ · 14 fichiers · 0 échec introduit"}},
  {who:"Codex CLI",what:"Ranger les dépendances avant le week-end",h:0.5}
 ],
 nocode:[
  {who:"L'assistant qui rédige",what:"Réponse au dossier Meyer",h:1.5},
  {who:"L'assistant qui chiffre",what:"Devis pour le chantier Lenoir",h:2,stop:{
    head:"Un devis partait sur la grille de l'an dernier",
    body:"La demande nommait la grille 2026. Le fichier que l'assistant a ouvert était celle de 2025. Il a été arrêté avant d'écrire une ligne, et on vous le dit maintenant plutôt qu'à la facturation.",
    saved:"Ce que ça vous a coûté : <b>rien</b>. Ce que ça aurait coûté : un devis signé <b>4 200 € en dessous</b>, découvert six semaines plus tard.",
    tech:null}},
  {who:"L'assistant qui trie",what:"Trier et répondre aux demandes simples",h:1},
  {who:"L'assistant qui rédige",what:"Réponse à la réclamation de Mme Aubert",h:1.5,gate:{
    head:"Prête à partir, et ça porte votre nom",
    body:"La réponse est écrite, elle nomme les documents qui ont servi, et une personne qui ne l'a pas rédigée l'a relue. L'envoi vous revient : c'est la seule chose ici qu'on ne peut pas reprendre.",
    detail:"Relu par : Camille · sources : le dossier Aubert, les conditions 2026"}},
  {who:"L'assistant qui rédige",what:"Compte-rendu de la réunion de ce matin",h:0.5}
 ]
};

var STATE_LABEL = {
 en:{next:"waiting",run:"running",you:"for you",done:"landed",stop:"stopped"},
 fr:{next:"à venir",run:"en cours",you:"pour vous",done:"atterri",stop:"arrêté"}
};

var CEIL=2, TICK=110, items=[], phase="idle", clicks=0, timer=null, hour=8, saved=false, track="code";

function t(k){ return T[LANG][k]; }
function build(){
 items = SCEN[LANG][track].map(function(s,i){
  return {i:i, who:s.who, what:s.what, h:s.h, stop:s.stop||null, gate:s.gate||null,
          st:"next", p:0, fixed:false, returned:false, gateDone:false};
 });
 phase="idle"; clicks=0; hour=8; saved=false;
 if(timer){ clearInterval(timer); timer=null; }
}

function fmtHour(){
 var hh=Math.floor(hour), mm=Math.round((hour-hh)*60);
 return (hh<10?"0":"")+hh+" h "+(mm<10?"0":"")+mm;
}
function totalHours(){
 var s=0; for(var i=0;i<items.length;i++) s+=items[i].h;
 return (LANG==="fr"? s.toString().replace(".",",") : s) + " h";
}

function drawRows(){
 var L=STATE_LABEL[LANG], h="";
 for(var i=0;i<items.length;i++){
  var it=items[i];
  h+='<div class="row s-'+it.st+'">'+
     '<div><p class="who">'+it.who+'</p><p class="what">'+it.what+'</p></div>'+
     '<span class="badge">'+L[it.st]+'</span>'+
     '<div class="track-bar"><i style="width:'+(it.st==="done"?100:it.p)+'%"></i></div>'+
     '</div>';
 }
 document.getElementById("rows").innerHTML=h;
 document.getElementById("clock").textContent = phase==="idle" ? t("clockLabel") : fmtHour();
}

function panel(k,head,body,extra,acts){
 return '<div class="panel lead"><p class="kicker">'+k+'</p><h3>'+head+'</h3>'+
        '<p>'+body+'</p>'+(extra||'')+'<div class="acts">'+acts+'</div></div>';
}

function drawSide(){
 var s=document.getElementById("side"), stopIt=null, gateIt=null, i;
 for(i=0;i<items.length;i++){
  if(items[i].st==="stop") stopIt=items[i];
  if(items[i].st==="you") gateIt=items[i];
 }
 if(phase==="idle"){
  s.innerHTML=panel(t("startK"),t("startH"),t("startP"),"",
   '<button class="btn primary big" id="go">'+t("startBtn")+'</button>');
 } else if(stopIt){
  var x=stopIt.stop;
  var tech = x.tech ? '<details class="tech"><summary>'+(LANG==="fr"?"Ce que le lanceur a imprimé":"What the launcher printed")+'</summary><pre>'+x.tech+'</pre></details>' : '';
  s.innerHTML=panel(t("stopK"),x.head,x.body,'<div class="saved">'+x.saved+'</div>'+tech,
   '<button class="btn primary" id="fix">'+t("fixBtn")+'</button>');
 } else if(gateIt){
  var g=gateIt.gate;
  s.innerHTML=panel(t("gateK"),g.head,g.body,
   '<div class="saved">'+g.detail+'</div>',
   '<button class="btn primary" id="ok">'+t("approve")+'</button>'+
   '<button class="btn ghost" id="back">'+t("ret")+'</button>');
 } else if(phase==="end"){
  s.innerHTML='<div class="panel lead"><p class="kicker">'+t("endK")+'</p><h3>'+t("endH")+'</h3>'+
   '<div class="tally">'+
    '<div class="good"><b>'+items.length+'</b><span>'+t("tDone")+'</span></div>'+
    '<div class="hot"><b>'+clicks+'</b><span>'+t("tClicks")+'</span></div>'+
    '<div><b>'+totalHours()+'</b><span>'+t("tWork")+'</span></div>'+
    (saved?'<div class="hot"><b>4 200 €</b><span>'+t("tSaved")+'</span></div>':'')+
   '</div>'+
   '<p class="strongline" style="margin-top:16px">'+t("endP")+'</p>'+
   '<div class="acts">'+
    '<a class="btn primary big" href="'+CAL+'">'+t("endBtn")+'</a>'+
    '<a class="btn ghost" href="https://github.com/Simon-Pacifae-Dupont/Guildwork">'+t("endGhost")+'</a>'+
    '<button class="btn ghost" id="again">'+t("again")+'</button>'+
   '</div></div>';
 } else {
  s.innerHTML='<div class="panel"><p class="kicker">'+t("runK")+'</p><h3>'+t("runH")+'</h3><p>'+t("runP")+'</p></div>';
 }
}

function running(){ var n=0; for(var i=0;i<items.length;i++) if(items[i].st==="run") n++; return n; }
function blocked(){ for(var i=0;i<items.length;i++) if(items[i].st==="stop"||items[i].st==="you") return true; return false; }

function tick(){
 var i,it,changed=false;
 for(i=0;i<items.length;i++){
  it=items[i];
  if(it.st==="run"){
   it.p += 100/((it.h*10)+6);
   if(it.p>=100){
    it.p=100;
    if(it.gate && !it.gateDone){ it.st="you"; it.gateDone=true; }
    else it.st="done";
   }
   changed=true;
  }
 }
 hour += 0.07;
 if(!blocked()){
  for(i=0;i<items.length;i++){
   it=items[i];
   if(it.st==="next" && running()<CEIL){
    if(it.stop && !it.fixed){ it.st="stop"; }
    else { it.st="run"; }
    changed=true;
    break;
   }
  }
 }
 var alldone=true;
 for(i=0;i<items.length;i++) if(items[i].st!=="done") alldone=false;
 if(alldone && phase!=="end"){ phase="end"; clearInterval(timer); timer=null; }
 drawRows(); drawSide();
}

function start(){ phase="run"; if(timer) clearInterval(timer); timer=setInterval(tick,TICK); drawRows(); drawSide(); }

function paint(){
 document.getElementById("eyebrow").textContent=t("eyebrow");
 document.getElementById("title").textContent=t("title");
 document.getElementById("lede").textContent=t("lede");
 document.getElementById("boardTitle").textContent=t("boardTitle");
 document.getElementById("foot1").textContent=t("foot1");
 document.getElementById("foot2").textContent=t("foot2");
 var bs=document.querySelectorAll(".tk");
 for(var i=0;i<bs.length;i++){
  bs[i].textContent=t(bs[i].getAttribute("data-track"));
  bs[i].setAttribute("aria-pressed", String(bs[i].getAttribute("data-track")===track));
 }
 drawRows(); drawSide();
}

document.addEventListener("click",function(e){
 var b=e.target.closest("button"); if(!b) return;
 if(b.getAttribute("data-track")){ track=b.getAttribute("data-track"); build(); paint(); return; }
 if(b.id==="go"){ clicks++; start(); return; }
 if(b.id==="fix"){
  clicks++; saved=true;
  for(var i=0;i<items.length;i++) if(items[i].st==="stop"){ items[i].fixed=true; items[i].st="next"; }
  drawRows(); drawSide(); return;
 }
 if(b.id==="ok"||b.id==="back"){
  clicks++;
  for(var j=0;j<items.length;j++) if(items[j].st==="you"){
   if(b.id==="ok"){ items[j].st="done"; }
   else { items[j].returned=true; items[j].st="next"; items[j].p=0; }
  }
  drawRows(); drawSide(); return;
 }
 if(b.id==="again"){ build(); paint(); return; }
});

var q=new URLSearchParams(location.search).get("piste")||new URLSearchParams(location.search).get("track");
if(q==="nocode"||q==="sans-code") track="nocode";
build(); paint();
</script>
</body>
