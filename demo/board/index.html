  var MISSION_LINE = new RegExp("^\\s*Mission:\\s*#(\\d+)\\s+(delivers|supersedes|refused)\\b", "mi");
  var els = {};
  ["eyebrow","h1","live-state","live-text","freshness","refresh","demo-note","stats","page-msg",
   "owed-h","owed-count","owed-state","owed-body","deleg-h","deleg-count","deleg-state","deleg-body",
   "ch-h","ch-count","chantiers-body","landed-h","landed-count","landed-body","foot"]
    .forEach(function (id) { els[id] = document.getElementById(id); });

  var state = { issues:null, prs:null, openPrs:null, issuesTruncated:0, storedAt:null,
                issuesErr:null, prsErr:null, openPrsErr:null };

  // ---- helpers ---------------------------------------------------------------
  function esc(s) { return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
  function unesc(s) { return String(s == null ? "" : s).replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&amp;/g,"&"); }
  function title(t) { return unesc(t).replace(/^#\d+\s*[—-]\s*/,"").replace(/^\[(MISSION|HANDOVER|REVIEW BRIEF)\]\s*/i,""); }
  var NOW = function () { return SOURCE === "static" ? STATIC.takenAt : Date.now(); };
  function daysSince(iso) { return iso ? Math.floor((NOW() - new Date(iso).getTime()) / 86400000) : null; }
  function age(iso) { var d = daysSince(iso); return d == null ? "" : d <= 0 ? T.today : d + " " + T.dayUnit; }
  function labels(it) { return (it && it.labels) || []; }
  function has(it, l) { return labels(it).indexOf(l) !== -1; }
  function isMission(it) { return has(it, CONFIG.labels.mission); }
  function link(kind, n) { return '<a href="' + REPO_URL + "/" + kind + "/" + n + '" target="_blank" rel="noopener">#' + n + "</a>"; }
  function fmt(s, vars) { return s.replace(/\{(\w+)\}/g, function (_, k) { return vars[k] != null ? vars[k] : ""; }); }

  // ---- the contract's own line: the only evidence that a delivery exists ----
  function deliveries(openPrs) {
    var byIssue = {}, noLine = [];
    (openPrs || []).forEach(function (p) {
      var m = MISSION_LINE.exec(String(p.body || ""));
      if (!m) { noLine.push(p); return; }
      var n = m[1], verb = m[2].toLowerCase();
      if (!byIssue[n] || p.number > byIssue[n].pr) byIssue[n] = { pr:p.number, verb:verb };
    });
    return { byIssue:byIssue, noLine:noLine };
  }

  function chantierOf(it) {
    var tagged = labels(it).filter(function (l) { return l.indexOf(CONFIG.labels.workstreamPrefix) === 0; });
    return tagged.length ? tagged[0].slice(CONFIG.labels.workstreamPrefix.length) : null;
  }

  function gateChip(it) {
    if (has(it, CONFIG.labels.gatePo)) return '<span class="chip c-owed">' + T.chipReserved + '</span>';
    if (has(it, CONFIG.labels.gateDelegated)) return '<span class="chip c-idle">' + T.chipDelegated + '</span>';
    return '<span class="chip c-idle">—</span>';
  }

  function issueRow(it, dl) {
    var d = dl.byIssue[String(it.number)];
    var stale = !d && daysSince(it.created_at) > CONFIG.staleDays;
    var st = gateChip(it) + (d ? ' <span class="chip c-flight">' + T.chipDelivered + ' #' + d.pr + '</span>' : '')
           + (stale ? ' <span class="chip c-flight">' + T.chipStale + '</span>' : '');
    return '<tr><td class="num">' + link("issues", it.number) + '</td><td>' + esc(title(it.title)) + '</td><td class="st">' + st +
      '</td><td class="age' + (stale ? ' old' : '') + '">' + age(it.created_at) + "</td></tr>";
  }
  function tableOf(rows, head) {
    return '<div class="tbl-scroll"><table><thead><tr><th>' + T.colLot + '</th><th>' + head + "</th><th>" + T.colGate + "</th><th>" + T.colAge + "</th></tr></thead><tbody>" + rows.join("") + "</tbody></table></div>";
  }
  function owedRows(list, chip) {
    chip = chip || "c-owed";
    return '<div class="owed-list">' + list.map(function (o) {
      var it = o.issue;
      return '<div class="owed-item"><div class="k">' + link("issues", it.number) + '</div><div class="q">' + esc(title(it.title)) +
        (o.d ? ' <span class="chip ' + chip + '">PR #' + o.d.pr + ' · ' + o.d.verb + '</span>' : '') +
        '</div><div class="a">' + fmt(T.openFor, {age:age(it.created_at)}) + "</div></div>";
    }).join("") + "</div>";
  }

  // ---- sections ---------------------------------------------------------------
  function renderOwed(issues, dl) {
    var gate = issues.filter(function (i) { return has(i, CONFIG.labels.gatePo); })
                     .sort(function (a,b) { return new Date(a.created_at) - new Date(b.created_at); });
    if (!gate.length) { els["owed-count"].textContent = ""; els["owed-body"].innerHTML = '<div class="msg info">' + fmt(T.noGatePo, {label:CONFIG.labels.gatePo}) + "</div>"; return 0; }
    if (dl === null) {
      els["owed-count"].textContent = "";
      els["owed-body"].innerHTML = '<div class="msg info">' + T.deliveriesPending + "</div>" + owedRows(gate.map(function (i) { return { issue:i, d:null }; }));
      return 0;
    }
    var now = [], later = [];
    gate.forEach(function (i) { var d = dl.byIssue[String(i.number)]; (d ? now : later).push({ issue:i, d:d || null }); });
    els["owed-count"].textContent = now.length ? fmt(T.toDecideCount, {n:now.length}) : T.nothingToDecide;
    var html = '<div class="sec-head sub"><h3>' + T.decisionNow + '</h3><span class="count">' + now.length + "</span></div>";
    html += now.length ? owedRows(now) : '<div class="msg info">' + T.nothingDeliveredOwed + "</div>";
    html += '<div class="sec-head sub"><h3>' + T.reservedNotReached + '</h3><span class="count">' + later.length + "</span></div>";
    html += later.length ? owedRows(later) + '<p class="state" style="margin-top:8px">' + T.reservedNote + "</p>" : '<div class="msg info">' + T.none + "</div>";
    els["owed-body"].innerHTML = html;
    return now.length;
  }

  function renderDelegated(issues, dl) {
    if (dl === null) { els["deleg-body"].innerHTML = '<div class="msg info">' + T.deliveriesPending + "</div>"; return 0; }
    var byNum = {}; issues.forEach(function (i) { byNum[String(i.number)] = i; });
    var list = Object.keys(dl.byIssue).map(function (n) { return { issue:byNum[n], d:dl.byIssue[n], n:n }; })
      .filter(function (o) { return o.issue && !has(o.issue, CONFIG.labels.gatePo); })
      .sort(function (a,b) { return a.d.pr - b.d.pr; });
    var orphan = Object.keys(dl.byIssue).filter(function (n) { return !byNum[n]; });
    els["deleg-count"].textContent = list.length ? fmt(T.deliveriesCount, {n:list.length}) : "";
    var html = list.length ? owedRows(list, "c-flight") : '<div class="msg info">' + T.nothingUnderDelegation + "</div>";
    if (orphan.length) html += '<div class="msg" style="margin-top:10px">' + fmt(T.orphanDeliveries, {list:orphan.map(function (n) { return link("issues", n); }).join(", ")}) + "</div>";
    if (dl.noLine.length) html += '<div class="msg" style="margin-top:10px">' + fmt(T.noMissionLine, {n:dl.noLine.length, list:dl.noLine.map(function (p) { return link("pull", p.number); }).join(", ")}) + "</div>";
    els["deleg-body"].innerHTML = html;
    return list.length;
  }

  function renderChantiers(issues, dl) {
    var missions = issues.filter(isMission);
    var groups = {}, unclassed = [];
    missions.forEach(function (it) { var c = chantierOf(it); if (!c) { unclassed.push(it); return; } (groups[c] = groups[c] || []).push(it); });
    var order = Object.keys(groups).sort(function (a,b) { return groups[b].length - groups[a].length || a.localeCompare(b); });
    var html = order.map(function (id) {
      var rows = groups[id].sort(function (a,b) { return a.number - b.number; }).map(function (it) { return issueRow(it, dl); });
      return '<div style="margin-bottom:22px"><div class="sec-head sub" style="margin-top:0"><h3>' + esc(CONFIG.workstreamNames[id] || id) + '</h3><span class="count">' + rows.length + "</span></div>" + tableOf(rows, T.colSubject) + "</div>";
    }).join("");
    if (unclassed.length) {
      html += '<div><div class="sec-head sub" style="margin-top:0"><h3>' + T.unclassified + '</h3><span class="count">' + unclassed.length + "</span></div>" +
        tableOf(unclassed.sort(function (a,b) { return a.number - b.number; }).map(function (it) { return issueRow(it, dl); }), T.colSubject) +
        '<div class="msg" style="margin-top:10px">' + fmt(T.unclassifiedNote, {prefix:CONFIG.labels.workstreamPrefix}) + "</div></div>";
    }
    els["ch-count"].textContent = fmt(T.missionsOpen, {n:missions.length});
    els["chantiers-body"].innerHTML = html || '<div class="msg info">' + T.noMissions + "</div>";
    return unclassed.length;
  }

  function renderLanded(prs) {
    var merged = prs.filter(function (p) { return p.merged_at; }).sort(function (a,b) { return new Date(b.merged_at) - new Date(a.merged_at); }).slice(0, 12);
    els["landed-count"].textContent = merged.length ? fmt(T.lastN, {n:merged.length}) : "";
    if (!merged.length) { els["landed-body"].innerHTML = '<div class="msg info">' + T.noRecentMerge + "</div>"; return; }
    els["landed-body"].innerHTML = '<div class="tbl-scroll"><table><thead><tr><th>PR</th><th>' + T.colWhatChanged + "</th><th>" + T.colMerged + "</th></tr></thead><tbody>" +
      merged.map(function (p) { return '<tr><td class="num">' + link("pull", p.number) + '</td><td>' + esc(title(p.title)) + '</td><td class="age">' + age(p.merged_at) + "</td></tr>"; }).join("") + "</tbody></table></div>";
  }

  function renderStats(issues, unclassed, owedNow, delegated) {
    var vals = [[issues.length, T.statOpen, ""], [owedNow, T.statToDecide, owedNow ? "owed" : ""], [delegated, T.statDelegated, delegated ? "flight" : ""], [unclassed, T.statUnclassified, ""]];
    if (state.issuesTruncated) vals.push([state.issuesTruncated, T.statUnread, "owed"]);
    els.stats.innerHTML = vals.map(function (v) { return '<div class="stat ' + v[2] + '"><div class="n">' + v[0] + '</div><div class="l">' + v[1] + "</div></div>"; }).join("");
  }

  function paint() {
    if (state.issues) {
      var dl = state.openPrs === null ? null : deliveries(state.openPrs);
      var unclassed = renderChantiers(state.issues, dl || { byIssue:{}, noLine:[] });
      var owedNow = renderOwed(state.issues, dl);
      var delegated = renderDelegated(state.issues, dl);
      renderStats(state.issues, unclassed, owedNow, delegated);
    }
    if (state.prs) renderLanded(state.prs);
    if (SOURCE === "static") { els.freshness.textContent = T.snapshotDate; }
    else if (state.storedAt) { var mins = Math.round((Date.now() - state.storedAt) / 60000); els.freshness.textContent = mins < 1 ? T.justNow : fmt(T.minutesAgo, {n:mins}); }
  }

  // ---- static chrome ----------------------------------------------------------
  els.eyebrow.textContent = T.eyebrow; els.h1.textContent = T.h1; els.refresh.textContent = T.refresh;
  els["live-text"].textContent = T.connecting;
  els["owed-h"].textContent = T.owedHeading; els["owed-state"].innerHTML = fmt(T.owedState, {label:'<span class="mono">' + esc(CONFIG.labels.gatePo) + '</span>'});
  els["deleg-h"].textContent = T.delegHeading; els["deleg-state"].innerHTML = T.delegState;
  els["ch-h"].textContent = T.chHeading; els["landed-h"].textContent = T.landedHeading;
  els.foot.innerHTML = T.footer;

  // ---- every code that has its own fix gets its own copy ----------------------
  function explain(err) {
    var s = esc(err && err.server ? err.server : CONFIG.server);
    switch (err && err.code) {
      case "server_not_connected": return { cls:"err", html:fmt(T.errNotConnected, {s:s}) };
      case "needs_reauth":         return { cls:"err", html:fmt(T.errReauth, {s:s}) };
      case "selection_required":   return { cls:"",    html:fmt(T.errSelection, {s:s}) };
      case "not_granted":          return null;
      case "blocked_by_policy":    return { cls:"err", html:T.errPolicy };
      case "approval_required":    return { cls:"",    html:T.errApproval };
      case "rate_limited":         return { cls:"",    html:T.errRate };
      case "server_unavailable":   return { cls:"",    html:T.errUnavailable };
      case "tool_error":           return { cls:"err", html:fmt(T.errTool, {m:esc(err.message || "")}) };
      default:                     return { cls:"err", html:fmt(T.errDefault, {m:esc((err && err.message) || "")}) };
    }
  }
  function showPageMsg(err) { var e = explain(err); els["page-msg"].innerHTML = e ? '<div class="msg ' + e.cls + '" style="margin-bottom:26px">' + e.html + "</div>" : ""; }
  function fallbackStatic(reason) {
    els["live-state"].innerHTML = '<span class="dot off"></span>' + esc(reason); els.refresh.disabled = true;
    ["owed-body","deleg-body","chantiers-body","landed-body"].forEach(function (k) { if (!els[k].innerHTML) els[k].innerHTML = '<div class="msg info">' + T.offlineSection + "</div>"; });
    els.stats.innerHTML = "";
  }

  // ---- live source: the viewer's own GitHub connector ---------------------------
  function startMcp(mcp) {
    var authzDenied = { needs_reauth:1, server_not_connected:1, blocked_by_policy:1, approval_required:1 };
    function onOk(ev, which) {
      state[which + "Err"] = null;
      state.storedAt = (ev.result && ev.result.cache && ev.result.cache.storedAt) || Date.now();
      els["live-state"].innerHTML = '<span class="dot live"></span>' + T.live; els.refresh.disabled = false;
      if (!state.issuesErr && !state.prsErr && !state.openPrsErr) els["page-msg"].innerHTML = "";
    }
    function onErr(ev, which) {
      state[which + "Err"] = ev.error;
      if (ev.error && authzDenied[ev.error.code]) state[which] = null;
      els["live-state"].innerHTML = '<span class="dot wait"></span>' + T.interrupted;
      showPageMsg(ev.error);
    }
    function watch(tool, input, onData, which) {
      return mcp.watchTool(CONFIG.server, tool, input, function (ev) {
        if (ev.type === "data") { onOk(ev, which); onData(ev.result && ev.result.payload); paint(); }
        else { onErr(ev, which); paint(); }
      }, { refetchInterval: CONFIG.refreshMs });
    }
    var issueInput = { owner:CONFIG.owner, repo:CONFIG.repo, state:"OPEN", perPage:100, fields:["number","title","labels","created_at","updated_at"] };

    // Page one is watched; the pages behind it are read on demand, and a page that
    // cannot be read is counted on the face of the board rather than dropped.
    watch("list_issues", issueInput, function (p) {
      var first = (p && p.issues) || (Array.isArray(p) ? p : []);
      var info = (p && p.pageInfo) || {};
      var total = (p && typeof p.totalCount === "number") ? p.totalCount : null;
      state.issues = first; state.issuesTruncated = 0;
      if (!info.hasNextPage) return;
      var all = first.slice(), cursor = info.endCursor, guard = 0;
      (function next() {
        if (!cursor || guard++ > 20) { state.issues = all; state.issuesTruncated = total != null ? Math.max(0, total - all.length) : 0; paint(); return; }
        var input = {}; Object.keys(issueInput).forEach(function (k) { input[k] = issueInput[k]; }); input.after = cursor;
        mcp.callTool(CONFIG.server, "list_issues", input, { cache:{ staleTime:CONFIG.refreshMs } }).then(function (r) {
          var q = r && r.payload; var page = (q && q.issues) || [];
          all = all.concat(page); var pi = (q && q.pageInfo) || {}; cursor = pi.hasNextPage ? pi.endCursor : null; next();
        }).catch(function () { state.issues = all; state.issuesTruncated = total != null ? Math.max(0, total - all.length) : 1; paint(); });
      })();
    }, "issues");

    watch("list_pull_requests", { owner:CONFIG.owner, repo:CONFIG.repo, state:"closed", perPage:30, sort:"updated", direction:"desc", fields:["number","title","merged_at"] },
      function (p) { state.prs = Array.isArray(p) ? p : (p && p.pull_requests) || []; }, "prs");

    watch("list_pull_requests", { owner:CONFIG.owner, repo:CONFIG.repo, state:"open", perPage:50, sort:"updated", direction:"desc", fields:["number","title","body"] },
      function (p) { state.openPrs = Array.isArray(p) ? p : (p && p.pull_requests) || []; }, "openPrs");

    els.refresh.addEventListener("click", function () {
      els.refresh.disabled = true; els["live-state"].innerHTML = '<span class="dot wait"></span>' + T.rereading;
      Promise.resolve(mcp.invalidate(CONFIG.server)).catch(function () {}).then(function () { setTimeout(function () { els.refresh.disabled = false; }, 3000); });
    });
  }

  // ---- static source: a frozen snapshot, for the demonstration ------------------
  function startStatic() {
    state.issues = STATIC.issues; state.prs = STATIC.closedPrs; state.openPrs = STATIC.openPrs; state.storedAt = STATIC.takenAt;
    els["live-state"].innerHTML = '<span class="dot off"></span>' + T.snapshot; els.refresh.hidden = true;
    els["demo-note"].hidden = false; els["demo-note"].innerHTML = T.demoNote;
    paint();
  }

  if (SOURCE === "static") { startStatic(); }
  else {
    claude.use("mcp").then(function (mcp) { if (!mcp) { fallbackStatic(T.offline); return; } startMcp(mcp); })
      .catch(function () { fallbackStatic(T.offline); });
    setInterval(paint, 60000);
  }
})();
</script>
