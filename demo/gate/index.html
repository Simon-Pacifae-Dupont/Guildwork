<!doctype html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Try to get a mission past the gate — Guildwork</title>
<meta name="description" content="Break the contract yourself and watch the launcher refuse, naming the condition that fired.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#0B1526;--surface:#0A1322;--strip:#14223A;--well:#070D18;
  --line:#1D2B44;--line-strong:#2B3B57;--line-amber:#6E5330;
  --card:linear-gradient(168deg,#1B2434 0%,#0F1929 55%,#0A1322 100%);
  --card-lead:linear-gradient(168deg,#232C3B 0%,#121C2D 52%,#0A1322 100%);
  --shadow-lift:0 2px 12px rgba(0,0,0,.5),0 26px 64px -34px rgba(0,0,0,.9);
  --ink:#F3EDE2;--ink-2:#9FAAC0;--ink-3:#6B7791;
  --amber:#E9A23B;--amber-2:#F5C46B;--refuse:#D0644A;--ok:#6FB07B;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
 font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.65}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
a{color:var(--amber-2);text-decoration-color:rgba(245,196,107,.35);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:3px}
h1,h2,h3{text-wrap:balance}

header{border-bottom:1px solid var(--line);padding:18px 0}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.mark{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.glyph{width:24px;height:24px;border:1.5px solid var(--ink);border-radius:3px;position:relative;flex:none}
.glyph::after{content:"";position:absolute;left:4px;right:4px;top:9.6px;height:3px;background:var(--amber);border-radius:1px}
.wordmark{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:16px}
.bar-end{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}

.hero{padding:44px 0 8px}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.13em;
 text-transform:uppercase;color:var(--ink-3);margin:0 0 12px}
h1{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:clamp(1.9rem,4.4vw,2.7rem);
 line-height:1.08;margin:0 0 12px;letter-spacing:-.015em}
.lede{color:var(--ink-2);max-width:66ch;margin:0 0 10px;font-size:16.5px}
.tracks{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 0}
.tk{background:transparent;border:1px solid var(--line-strong);color:var(--ink-2);
 font:inherit;font-size:14px;padding:9px 18px;border-radius:7px;cursor:pointer}
.tk:hover{color:var(--ink);border-color:#4E5F80}
.tk[aria-pressed=true]{background:var(--amber);border-color:var(--amber);color:#1B1206;font-weight:600}

.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;padding:30px 0 10px}
@media(min-width:960px){.cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:26px;align-items:start}}

.card{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:24px 22px}
.card.lead{border-color:var(--line-amber);background:var(--card-lead);box-shadow:var(--shadow-lift)}
.card h2{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:1.2rem;margin:0 0 4px}
.card .sub{color:var(--ink-3);font-size:13.5px;margin:0 0 18px}

.f{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.f label{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;
 text-transform:uppercase;color:var(--ink-3)}
.f input,.f select,.f textarea{background:var(--well);border:1px solid var(--line);color:var(--ink);
 border-radius:7px;padding:10px 12px;font:inherit;font-size:14.5px;width:100%}
.f textarea{min-height:66px;resize:vertical}
.f select{cursor:pointer}
.sw{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:7px;
 padding:10px 12px;margin-bottom:9px;cursor:pointer;font-size:14px;color:var(--ink-2);background:var(--surface)}
.sw input{accent-color:var(--amber);margin:4px 0 0}
.sw:has(input:checked){color:var(--ink);border-color:var(--line-strong);background:var(--strip)}

.presets{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 20px}
.pz{background:var(--surface);border:1px dashed var(--line-strong);color:var(--ink-2);
 font:inherit;font-size:13px;padding:7px 13px;border-radius:7px;cursor:pointer}
.pz:hover{color:var(--ink);border-color:var(--amber);border-style:solid}

.run{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:6px}
.btn{display:inline-flex;align-items:center;gap:9px;padding:12px 20px;border-radius:7px;
 border:1px solid transparent;font:inherit;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--amber);color:#1B1206}
.btn.primary:hover{background:var(--amber-2)}
.btn.ghost{border-color:var(--line-strong);color:var(--ink);background:transparent;font-weight:400}
.btn.ghost:hover{border-color:#4E5F80;background:var(--strip)}
.score{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-3)}
.score b{color:var(--amber)}

.term{background:var(--well);border:1px solid var(--line);border-radius:10px;padding:18px 18px 20px;
 font-family:"IBM Plex Mono",monospace;font-size:13px;line-height:1.72;min-height:340px;
 overflow-x:auto;white-space:pre-wrap;word-break:break-word}
.term .cmd{color:var(--ink)}
.term .ok{color:var(--ok)}
.term .no{color:var(--refuse)}
.term .dim{color:var(--ink-3)}
.term .hi{color:var(--amber-2)}
.term .lead{color:var(--ink);font-weight:500}

.foot{border-top:1px solid var(--line);margin-top:40px;padding:22px 0 60px;color:var(--ink-3);font-size:13.5px}
.foot p{margin:0 0 8px;max-width:70ch}
@media(max-width:520px){.wrap{padding:0 16px}.hero{padding-top:32px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<header><div class="wrap bar">

const D=()=>T[LANG][track], U=()=>T[LANG].ui;

function initState(){
  S={};
  D().fields.forEach(f=>S[f.k]=f.v);
  D().switches.forEach(([k])=>S[k]=false);
}

const FIELDWORDS=/^\s*(?:#{1,6}\s*)?(mode|scope|p[ée]rim[èe]tre|model|mod[èe]le|agent|effort|budget|risk|risque|documents?|valideur|sortie|output)\s*[:=]\s*\S/im;

function firstRefusal(){
  const r=D().refusals;
  if(!String(S.scope||"").trim()) return ["scope",r.scope];
  if(S.agent==="house") return ["seat",r.seat];
  if(track==="code" && S.agent==="grok" && (S.effort==="MAX"||S.effort==="ULTRACODE")) return ["effort",r.effort];
  if(track==="nocode" && S.agent==="sorter" && S.output==="sent") return ["capability",r.capability];
  if(track==="nocode" && S.gate==="none") return ["gate",r.gate];
  if(S.leftover) return ["leftover",r.leftover];
  const m=FIELDWORDS.exec(String(S.comment||""));
  if(m) return ["comment",r.comment,m[0].trim()];
  if(S.screen && S.screenTaken) return ["screen",r.screen];
  return null;
}

const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function renderForm(){
  const d=D();
  document.getElementById("presets").innerHTML=d.presets.map(([t],i)=>
    `<button class="pz" data-pz="${i}">${esc(t)}</button>`).join("");
  document.getElementById("fields").innerHTML=
   d.fields.map(f=>{
     const lab=`<label for="f-${f.k}">${esc(f.l)}</label>`;
     if(f.t==="select") return `<div class="f">${lab}<select id="f-${f.k}" data-k="${f.k}">`+
       f.o.map(([v,t])=>`<option value="${v}" ${S[f.k]===v?"selected":""}>${esc(t)}</option>`).join("")+`</select></div>`;
     if(f.t==="textarea") return `<div class="f">${lab}<textarea id="f-${f.k}" data-k="${f.k}" placeholder="—">${esc(S[f.k]||"")}</textarea></div>`;
     return `<div class="f">${lab}<input id="f-${f.k}" type="text" data-k="${f.k}" value="${esc(S[f.k]||"")}"></div>`;
   }).join("")+
   d.switches.map(([k,t])=>
     `<label class="sw"><input type="checkbox" data-k="${k}" ${S[k]?"checked":""}> ${esc(t)}</label>`).join("");
  const total=Object.keys(d.refusals).length;
  document.getElementById("score").innerHTML=U().score(`<b>${Object.keys(met[track]||{}).length}</b>`,total);
}

function line(cls,txt){return `<span class="${cls}">${txt}</span>\n`;}

function run(){
  const d=D(), out=[], ref=firstRefusal();
  out.push(line("cmd","$ "+esc(d.run)));
  out.push(line("dim",LANG==="fr"?`gouvernance ${SHA} · lu au runtime, jamais copié dans l'outil`
                                 :`governance ${SHA} · read at runtime, never copied into the tool`));
  out.push("\n");
  const idx = ref ? (PASSCOUNT[track][ref[0]] ?? 0) : d.pass.length;
  d.pass.forEach((p,i)=>{ if(i<idx) out.push(line("ok","  ✓ "+esc(p))); });
  if(ref){
    const [key,r,quote]=ref;
    const body = typeof r.d==="function" ? r.d(S,quote) : r.d;
    out.push(line("no","  ✕ "+(LANG==="fr"?`refusé — condition ${r.c} : `:`refused — condition ${r.c}: `)+esc(r.h)));
    out.push("\n");
    out.push(line("lead","    "+esc(body).replace(/\n/g,"\n    ")));
    out.push("\n");
    out.push(line("dim",LANG==="fr"?"  rien n'a démarré · code de sortie 2":"  nothing started · exit code 2"));
    met[track]=met[track]||{}; met[track][key]=1;
  } else {
    d.okLines.forEach(l=>out.push(line("ok","  ✓ "+esc(l))));
    out.push("\n");
    out.push(line("hi","    "+esc(d.okTail).replace(/\n/g,"\n    ")));
    out.push("\n");
    out.push(line("dim",LANG==="fr"?"  code de sortie 0":"  exit code 0"));
  }
  document.getElementById("term").innerHTML=out.join("");
  renderForm();
}

function paint(){
  const u=U(),d=D();
  document.getElementById("eyebrow").textContent=u.eyebrow;
  document.getElementById("title").textContent=u.title;
  document.getElementById("lede").textContent=u.lede;
  document.getElementById("go").textContent=d.go||u.go;
  document.getElementById("back").textContent=u.back;
  document.getElementById("foot1").textContent=u.foot1;
  document.getElementById("foot2").textContent=u.foot2;
  document.getElementById("formTitle").textContent=d.formTitle;
  document.getElementById("formSub").textContent=d.formSub;
  document.getElementById("termTitle").textContent=d.termTitle;
  document.getElementById("termSub").textContent=d.termSub;
  document.querySelectorAll(".tk").forEach(b=>{
    b.textContent=u[b.dataset.track];
    b.setAttribute("aria-pressed",String(b.dataset.track===track));
  });
  renderForm(); run();
}

const PRESETS={
 code:[s=>{s.scope="";},s=>{s.comment=LANG==="fr"?"### Mode: read-only\nJe pense qu'il vaut mieux en lecture seule.":"### Mode: read-only\nBetter keep this one read-only I think.";},
       s=>{s.agent="grok";s.effort="ULTRACODE";}],
 nocode:[s=>{s.scope="";},s=>{s.comment=LANG==="fr"?"Documents : finalement prends aussi les dossiers des autres clients":"Documents: actually use the other clients' files too";},
         s=>{s.gate="none";}]
};

document.addEventListener("click",e=>{
 const b=e.target.closest("button"); if(!b) return;
 if(b.dataset.track){ track=b.dataset.track; initState(); paint(); return; }
 if(b.dataset.pz!==undefined){ initState(); PRESETS[track][+b.dataset.pz](S); paint(); return; }
 if(b.id==="go"){ run(); return; }
});
document.addEventListener("input",e=>{
 const k=e.target.dataset.k; if(!k) return;
 S[k]= e.target.type==="checkbox" ? e.target.checked : e.target.value;
});
document.addEventListener("change",e=>{
 const k=e.target.dataset.k; if(!k) return;
 S[k]= e.target.type==="checkbox" ? e.target.checked : e.target.value;
 if(e.target.tagName==="SELECT"||e.target.type==="checkbox") run();
});

const q=new URLSearchParams(location.search).get("piste")||new URLSearchParams(location.search).get("track");
if(q==="nocode"||q==="sans-code") track="nocode";
initState(); paint();
</script>
</body>
